name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6   # the version comes from package.json's packageManager

      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'       # 22.18 or later: TypeScript runs through Node's type stripping
          cache: pnpm

      - name: ffmpeg (the tests decode MP3 and OGG with it, as users with ffmpeg do)
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Install Playwright's Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build, unit tests (vitest) and browser tests (Playwright)
        run: pnpm test

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
